<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn" title="Alternar Tema">
        <i class="fas fa-sun"></i>
    </button>
    <div class="login-container">
        <div class="login-card">
            <h1 id="form-title">Nova Senha</h1>
            <p id="form-subtitle">Escolha uma senha forte para sua segurança.</p>
            
            <div id="message-box" class="message-box"></div>

            <form id="reset-form">
                <div class="input-group">
                    <label for="new-password">Nova Senha</label>
                    <input type="password" id="new-password" placeholder="••••••••" required minlength="6">
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" id="submit-btn">Atualizar Senha</button>
            </form>
            
            <div class="toggle-container">
                <button id="back-to-login" class="toggle-btn" style="text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Voltar ao Login
                </button>
            </div>
        </div>
    </div>
    <script src="scripts/reset-password.js"></script>
</body>
</html>
