<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Quadro Kanban</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- As colunas serão injetadas aqui pelo JavaScript -->
        
        <div class="col add-column-col" id="add-column-btn">
            <span>+ Nova Coluna</span>
        </div>
    </div>

    <div class="settings-container">
        <button id="settings-toggle-btn" class="gear-btn">
            <i class="fas fa-cog"></i>
        </button>

        <div id="settings-menu" class="settings-menu">
            <div class="menu-header">
                <span id="display-email">carregando...</span>
            </div>
            <div class="menu-body">
                <button id="account-btn" class="menu-btn account" type="button">
                    <i class="fas fa-user"></i> Conta
                </button>
                
                <div class="theme-switch-row">
                    <span><i class="fas fa-moon"></i> Modo Escuro</span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <hr>

                <a href="privacy-policy.html" class="menu-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: flex-start; color: inherit; padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.05)'" onmouseout="this.style.backgroundColor='transparent'">
                    <i class="fas fa-shield-alt" style="margin-right: 10px;"></i> Privacidade
                </a>

                <hr>

                <button id="logout-btn" class="menu-btn logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
    
    <script type="module" src="scripts/pages/kanban.js"></script>
</body>
</html>
