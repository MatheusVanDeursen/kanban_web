<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <!-- Adicionando o SDK Oficial do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <button id="login-theme-toggle" class="theme-toggle-btn" title="Alternar Tema">
        <i class="fas fa-sun"></i>
    </button>
    <div class="login-container">
        <div class="login-card">
            <h1 id="form-title">Entrar</h1>
            <p id="form-subtitle">Bem-vindo de volta ao seu quadro!</p>
            
            <div id="message-box" class="message-box"></div>

            <form id="auth-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group" id="password-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <a href="#" id="forgot-password-link" class="forgot-link">Esqueceu a senha?</a>
                
                <button type="submit" id="submit-btn">Entrar</button>
            </form>

            <!-- Separador e Botão do Google -->
            <div class="separator" id="social-separator">
                <span>ou</span>
            </div>
            
            <div class="google-btn-wrapper" id="social-wrapper">
                <div id="google-button-div"></div>
            </div>
            
            <div class="toggle-container">
                <span id="toggle-text">Não tem uma conta?</span>
                <button id="toggle-btn">Cadastre-se</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
