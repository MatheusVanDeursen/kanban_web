<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kanban</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <button id="login-theme-toggle" class="theme-toggle-btn" title="Alternar Tema">
        <i class="fas fa-sun"></i>
    </button>
    <div class="login-container">
        <div class="login-card">
            <h1 id="form-title">Entrar</h1>
            <p id="form-subtitle">Bem-vindo de volta ao seu quadro!</p>
            
            <form id="auth-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="submit-btn">Entrar</button>
            </form>
            
            <div class="toggle-container">
                <span id="toggle-text">Não tem uma conta?</span>
                <button id="toggle-btn">Cadastre-se</button>
            </div>
        </div>
    </div>
    <script src="scripts/login.js"></script>
</body>
</html>
